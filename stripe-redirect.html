<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCell Ödeme</title>
</head>
<body style="font-family:Arial;background:#0d1624;color:white;text-align:center;padding:40px;">
<h2>Ödeme ekranına yönlendiriliyorsunuz...</h2>
<p>Lütfen bekleyin.</p>

<script>
const p = new URLSearchParams(location.search);
const to = p.get("to");

if (to) {
  location.replace(decodeURIComponent(to));
} else {
  document.body.innerHTML = "<h2>Ödeme bağlantısı bulunamadı.</h2>";
}
</script>
</body>
</html>
